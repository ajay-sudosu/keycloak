version: '3.8'

services:
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Database connection details
      DB_VENDOR: postgres
      DB_ADDR: db
      DB_PORT: 5432
      DB_DATABASE: keycloak
      DB_USER: root
      DB_PASSWORD: root
      # Admin user credentials
      KEYCLOAK_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./themes:/opt/keycloak/themes

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
